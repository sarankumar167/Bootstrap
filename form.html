<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
    <form>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" class="form-control" id="name" placeholder="Enter name" name="name">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
        </div>
        <div class="form-group">
            <label for="Feedback">Feedback:</label>
            <textarea id="Feedback" class="form-control" rows="5" placeholder="Enter your feedback"></textarea>
        </div>

     <div class="form-group">
         <label for="sel1">How do you know about us:</label>
  <select class="form-control" id="sel1">
    <option value="apple">Social Media</option>
    <option value="pineapple">Friends</option>
    <option value="grapes">College</option>
    <option value="orange">Family</option>
  </select>
  </div>

  <label for="flexRadioDefault1" class="mt-4 d-block">Rate Us!</label>

  <div class="form-check-inline">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
  <label class="form-check-label" for="flexRadioDefault1">
    1
  </label>
</div>


<div class="form-check-inline">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2">
  <label class="form-check-label" for="flexRadioDefault2">
    2
  </label>
</div>


<div class="form-check-inline">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault3">
  <label class="form-check-label" for="flexRadioDefault3">
    3
  </label>
</div>


<div class="form-check-inline">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault4">
  <label class="form-check-label" for="flexRadioDefault4">
    4
  </label>
</div>


<div class="form-check-inline">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault5">
  <label class="form-check-label" for="flexRadioDefault5">
    5
  </label>
</div>

     <button type="Submit" class="btn btn-outline-primary d-block mx-auto my-4">Submit</button>

    </form>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script> 
</body>
</html>
