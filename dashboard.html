<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container text-center ">
        <h1>Student Profile</h1>
    <ul class="breadcrumb ">
        
        <li class="breadcrumb-item">Home</li>
    
        <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="#">My Course</a></li>
    </ul>

    <button type="button" class="btn btn-outline-primary mt-4 "> Start New Course</button>
    
    <h3 class="mt-4"> My Progress</h3>
    <span class="badge badge-success">3 Courses</span>
    <div class="progress mt-5">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%;"> 70%</div>
    </div>
    <ul class="pagination mt-4 justify-content-center mt-5">
        <li class="page-item"><a class="page-link" href="#"> previous</a></li>
        <li class="page-item"><a class="page-link" href="#"> 1</a></li>
        <li class="page-item"><a class="page-link" href="#"> 2</a></li>
        <li class="page-item"><a class="page-link" href="#"> 3</a></li>
        <li class="page-item"><a class="page-link" href="#"> Next</a></li>
    </ul>

    </div>
    
</body>
</html>
