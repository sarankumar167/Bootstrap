<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <form>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" placeholder="Enter name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" >
            </div>
            <div class="form-group">
                <label for="feedback">Feedback:</label>
                <textarea id="feedback"  class="form-control" rows="5" placeholder="Enter your feedback"></textarea>
            </div>

             <label for="radiobutton" class="mt-4 d-block">Preffered Contact Method</label>
            <div class="form-check-inline">
                <input class="form-check-input" type="radio" name="radiobutton" id="radiobutton1">
                <label class="form-check-label" for="radiobutton1">
                 Email
                </label>
            </div>

            <div class="form-check-inline">
                <input class="form-check-input" type="radio" name="radiobutton" id="radiobutton2">
                <label class="form-check-label" for="radiobutton2"> Phone</label>
            </div>


             <div class="form-group mt-5">
         <label for="sel1">Type Of Order:</label>
  <select class="form-control" id="sel1">
    <option value="apple">Cake</option>
    <option value="pineapple">Cookies</option>
    <option value="grapes">Pastries</option>
  </select>
  </div>

  <label for="radio" class="mt-4 d-block">Rate Us!</label>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio1">
    <label class="form-check-label" for="radio1">1</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio2">
    <label class="form-check-label" for="radio2">2</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio3">
    <label class="form-check-label" for="radio3">3</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio4">
    <label class="form-check-label" for="radio4">4</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio5">
    <label class="form-check-label" for="radio5">5</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio6">
    <label class="form-check-label" for="radio6">6</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio7">
    <label class="form-check-label" for="radio7">7</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio8">
    <label class="form-check-label" for="radio8">8</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio9">
    <label class="form-check-label" for="radio9">9</label>
  </div>

  <div class="form-check-inline">
    <input class="form-check-input" type="radio" name="radio" id="radio10">
    <label class="form-check-label" for="radio10">10</label>
  </div>

  <button type="Submit" class="btn btn-outline-primary d-block mx-auto my-4">Submit</button>

        </form>
    </div>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script> 
</body>
</html>
