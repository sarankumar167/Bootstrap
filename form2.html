<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <form>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" placeholder="Enter name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" >
            </div>
            <div class="form-group">
                <label for="feedback">Feedback:</label>
                <textarea id="feedback"  class="form-control" rows="5" placeholder="Enter your feedback"></textarea>
            </div>

             <label for="radiobutton" class="mt-4 d-block">Preffered Contact Method</label>
            <div class="form-check-inline">
                <input class="form-check-input" type="radio" name="radiobutton" id="radiobutton1">
                <label class="form-check-label" for="radiobutton1">
                 Email
                </label>
            </div>

            <div class="form-check-inline">
                <input class="form-check-input" type="radio" name="radiobutton" id="radiobutton2">
                <label class="form-check-label" for="radiobutton2"> Phone</label>
            </div>


             <div class="form-group mt-5">
         <label for="sel1">Type Of Order:</label>
  <select class="form-control" id="sel1">
    <option value="Cake">Cake</option>
    <option value="Cookies">Cookies</option>
    <option value="Pastries">Pastries</option>
  </select>
  </div>

  <div class="form-group">
    <label for="rating"> Satisfaction Level</label>
    <input type="range" class="form-control-range" id="rating">
  </div>

  <button type="Submit" class="btn btn-outline-primary d-block mx-auto my-4">Submit</button>

        </form>
    </div>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script> 
</body>
</html>
