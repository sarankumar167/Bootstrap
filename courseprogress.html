<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="container text-center mt-5 bg-light">
    <h1 class="text-warning">Course Progress Dashboard</h1>
    <ul class="breadcrumb mt-5">
        
        <li class="breadcrumb-item">Home</li>
    
        <li class="breadcrumb-item"><a href="#">Course</a></li>
        <li class="breadcrumb-item"><a href="#">Web Development</a></li>
    </ul>
    <h2 class="text-info">Web Development Course <span class="badge badge-danger">New</span></h2>
    <div class="progress mt-5">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-success " style="width: 100%;"> HTML 100%</div>
    </div>

    <div class="progress mt-5">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary  "style="width: 75%;"> CSS 75%</div>
    </div>

    <div class="progress mt-5">
        <div class="progress-bar progress-bar-striped progress-bar-animated   " style="width: 50%; background-color: orange;"> Javascript 50%</div>
    </div>

    <div class="progress mt-5">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger " style="width: 25%;"> Bootstrap 25%</div>
    </div>
    <div>
    <button type="button" class="btn btn-outline-primary mt-4">Start</button>
    <button type="button" class="btn btn-outline-success mt-4">Pause</button>
    <button type="button" class="btn btn-outline-danger mt-4">Start</button>
    </div>
    <ul class="pagination justify-content-end mt-4">
         <li class="page-item"><a class="page-link" href="#">Previous</a></li> 
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"> <a class="page-link" href="">2</a></li>
        <li class="page-item disabled"> <a class="page-link" href="">3</a></li>
        <li class="page-item"> <a class="page-link" href="">Next</a></li>
    </ul>
</div>
    
</body>
</html>
